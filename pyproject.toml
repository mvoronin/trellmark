[project]
name = "trellmark"
version = "0.1.0"
description = "Keep links, write notes, build your map."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.139.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "SQLAlchemy>=2.0.51",
    "uvicorn>=0.50.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "playwright>=1.52",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["trellmark"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
extend-exclude = [".codex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
