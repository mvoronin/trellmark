<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trellmark</title>
    <!-- The SVG is what any current browser uses; the ICO is the fallback for
         the ones that ask for a raster. Both are declared under /static, which
         this app already serves. A bare /favicon.ico at the origin root — what
         a bookmark or a feed reader asks for with no link to go on — is the
         edge's to answer, and the edge lives in the infrastructure repo. -->
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/static/favicon.ico" sizes="48x48 32x32 16x16">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <!-- Pin the saved theme before first paint so an explicit light/dark
         choice doesn't flash the wrong colors. "system" needs nothing here —
         color-scheme follows the OS. app.js keeps the toggle in sync. -->
    <script>
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (error) {}
    </script>
    <!-- The two Latin subsets are needed for first paint on an English UI; the
         Cyrillic ones load on demand via unicode-range. crossorigin is required
         on font preloads even same-origin, or the fetch is made twice. -->
    <link rel="preload" href="/static/fonts/golostext-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/ptsansnarrow-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" type="module"></script>
  </head>
  <body>
    <section id="session-pending" class="auth-shell" aria-live="polite">
      <p>Checking session…</p>
    </section>

    <section id="login-view" class="auth-shell" hidden>
      <form id="login-form" class="login-form">
        <h1>Trellmark</h1>
        <label for="login-input">Login</label>
        <input
          id="login-input"
          name="login"
          type="text"
          autocomplete="username"
          maxlength="128"
          required
          autofocus
        >
        <label for="password-input">Password</label>
        <input
          id="password-input"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
        <button id="login-button" type="submit">Log in</button>
        <p id="login-status" role="status" aria-live="polite"></p>
      </form>
      <div class="theme-toggle" role="group" aria-label="Color theme">
        <button type="button" data-theme-value="system" aria-pressed="true">System</button>
        <button type="button" data-theme-value="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
      </div>
    </section>

    <div id="app-view" hidden>
    <header class="app-header">
      <form id="url-form" class="url-form" autocomplete="off">
        <label class="sr-only" for="url-input">URL</label>
        <div class="input-wrap">
          <input
            id="url-input"
            name="url"
            type="text"
            inputmode="url"
            placeholder="https://example.com"
            required
            autofocus
          >
          <button id="url-clear" class="input-clear" type="button" aria-label="Clear input" hidden>
            <svg class="icon icon-x" aria-hidden="true"><use href="/static/icons.svg#x"></use></svg>
          </button>
        </div>
        <button id="save-button" type="submit">Add</button>
        <p id="form-status" role="status"></p>
      </form>
      <div class="header-side">
        <div class="header-controls">
          <p id="url-count">0 saved</p>
          <div class="group-filter" role="group" aria-label="Group visibility">
            <button type="button" data-group-filter="safe" aria-pressed="true">Safe</button>
            <button type="button" data-group-filter="all" aria-pressed="false">All</button>
          </div>
          <div class="data-controls">
            <button id="export-button" type="button">Export</button>
            <label class="import-control" for="import-input">
              Import
              <input id="import-input" type="file" accept="application/json,.json">
            </label>
            <button id="import-retry-button" type="button" hidden disabled>Retry import</button>
          </div>
          <label class="sort-control">
            Sort
            <select id="sort-select">
              <option value="added-desc">Newest first</option>
              <option value="added-asc">Oldest first</option>
              <option value="domain">Domain</option>
            </select>
          </label>
          <label class="delete-toggle">
            <input type="checkbox" id="delete-immediately">
            Delete immediately
          </label>
          <button id="logout-button" type="button">Log out</button>
        </div>
        <div class="theme-toggle" role="group" aria-label="Color theme">
          <button type="button" data-theme-value="system" aria-pressed="true">System</button>
          <button type="button" data-theme-value="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-value="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
    </header>

    <main class="url-panel" aria-live="polite">
      <form id="group-form" class="group-form" autocomplete="off">
        <label class="sr-only" for="group-input">New group</label>
        <input id="group-input" name="name" type="text" placeholder="New group" required>
        <label class="sr-only" for="group-domains">Domains</label>
        <input
          id="group-domains"
          name="domains"
          type="text"
          placeholder="Domains (comma-separated)"
        >
        <label class="sr-only" for="group-parent">Parent group</label>
        <select id="group-parent" name="parent_id" aria-label="Parent group">
          <option value="">Root</option>
        </select>
        <label class="group-nsfw-toggle">
          <input id="group-nsfw" name="nsfw" type="checkbox">
          NSFW
        </label>
        <button id="group-button" type="submit">Add group</button>
        <p id="group-status" role="status"></p>
      </form>
      <div id="groups" class="groups"></div>
    </main>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <p class="confirm-title">Delete this URL?</p>
      <p class="confirm-url" id="confirm-url"></p>
      <form method="dialog" class="confirm-actions">
        <button value="cancel" class="confirm-cancel">Cancel</button>
        <button value="delete" class="confirm-delete" autofocus>Delete</button>
      </form>
    </dialog>

    <dialog id="group-edit-dialog" class="confirm-dialog group-edit-dialog">
      <form id="group-edit-form" class="edit-form" autocomplete="off">
        <p class="confirm-title">Edit group</p>
        <label>
          Group name
          <input id="group-edit-name" name="name" type="text" required>
        </label>
        <label class="group-nsfw-toggle">
          <input id="group-edit-nsfw" name="nsfw" type="checkbox">
          NSFW
        </label>
        <label>
          Domains
          <textarea
            id="group-edit-domains"
            name="domains"
            rows="4"
            placeholder="example.com&#10;another.example"
          ></textarea>
        </label>
        <label>
          Parent group
          <select id="group-edit-parent" name="parent_id">
            <option value="">Root</option>
          </select>
        </label>
        <p id="group-edit-status" class="dialog-status" role="status"></p>
        <div class="confirm-actions">
          <button id="group-edit-cancel" type="button" class="confirm-cancel">Cancel</button>
          <button id="group-edit-save" type="submit" class="confirm-save">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="url-edit-dialog" class="confirm-dialog">
      <form id="url-edit-form" class="edit-form" autocomplete="off">
        <p class="confirm-title">Edit URL</p>
        <label>
          Name / title
          <input id="url-edit-title" name="title" type="text" placeholder="Use URL when empty">
        </label>
        <label>
          Address
          <input id="url-edit-url" name="url" type="text" inputmode="url" required>
        </label>
        <p id="url-edit-status" class="dialog-status" role="status"></p>
        <div class="confirm-actions">
          <button id="url-edit-cancel" type="button" class="confirm-cancel">Cancel</button>
          <button id="url-edit-save" type="submit" class="confirm-save">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="group-delete-dialog" class="confirm-dialog">
      <p class="confirm-title">Delete <span id="group-delete-name"></span>?</p>
      <p class="confirm-url" id="group-delete-summary"></p>
      <form method="dialog" class="confirm-actions group-delete-actions">
        <button value="cancel" class="confirm-cancel">Cancel</button>
        <button value="move_to_default" class="confirm-save" autofocus>Move links to default</button>
        <button value="delete" class="confirm-delete">Delete links</button>
      </form>
    </dialog>
    </div>
  </body>
</html>
